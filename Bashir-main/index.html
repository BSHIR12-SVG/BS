<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بشير لصيانة الاجهزة الالكترونية والرقمية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="highlight"></span> 
                <span class="ps4-text"></span> 
                <span class="ps5-text"></span>
            </h1>
            <div class="subtitle">بشير لصيانة الاجهزة الالكترونية والرقمية شارع طرابلس الداخلى اجدابيا</div>
            <div class="version-badge"></div>
        </header>
        
        <hr class="separator">

        <div id="menu">
            <h2 class="fw-title">⚡ ... تحميل</h2>
            <p class="fw-range">كشف تلقائي <span class="range-highlight">6.72  الى 11.02</span></p>
            
            <div class="status-bar">
                <span id="msgs" class="status-text loading">⏳ Starting...</span>
            </div>

            <footer>
               
                <p class="thanks">❤️ شكر خاص لجميع مطوري الثغره</p>
            </footer>
        </div>
    </div>

    <script>
        var msgs = document.getElementById('msgs');

        function updateStatus(msg) {
            msgs.innerHTML = msg;
        }

        // التحقق من الجهاز والإصدار
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        // بدء التشغيل التلقائي
        document.addEventListener("DOMContentLoaded", function() {
            if (!isPS4) {
                updateStatus('⚠️! الصفحة مخصصة لجهاز بلاي ستيشن 4 فقط');
                msgs.className = 'status-text error';
                return;
            }

            if (fwNum >= 6.72 && fwNum <= 11.02) {
                updateStatus('✅ Detected PS4 Firmware: ' + fwVersion);
                
                // الانتظار ثم الذهاب إلى run
                setTimeout(function() {
                    updateStatus('🚀 Loading exploit...');
                    window.location.replace('run/index.html');
                }, 1500);
            } else {
                updateStatus('❌ Unsupported Firmware: ' + fwVersion + ' (Requires 10.00-11.02)');
                msgs.className = 'status-text error';
            }
        });
    </script>
</body>
</html>
