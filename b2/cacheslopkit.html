<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="slopkit.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بشير لصيانة الأجهزة الإلكترونية - تثبيت الذاكرة المؤقتة</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
        <style>
        * {
            box-sizing: border-box;
        }
                body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(rgba(13, 17, 23, 0.65), rgba(22, 27, 34, 0.65)), url('../img.jpg?v=1.0') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
        }
        h1.logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            margin-top: 0;
        }
        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.4), transparent);
            margin: 20px 0 40px 0;
        }
        .loader-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }
        .loader-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00f2fe, transparent);
            animation: loading-bar 2s linear infinite;
        }
        @keyframes loading-bar {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        #msgs {
            font-size: 1.5rem;
            font-weight: 500;
            color: #e6edf3;
            line-height: 1.6;
            margin: 0;
        }
        .fb-card {
            display: block;
            padding: 15px;
            background: rgba(24, 119, 242, 0.1);
            border: 1px solid rgba(24, 119, 242, 0.3);
            border-radius: 12px;
            color: #1877f2;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .fb-card:hover {
            background: rgba(24, 119, 242, 0.2);
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo-text">Bashir PS4/PS5</h1>
        <hr>
        <div class="loader-card">
            <h2 id="msgs">جاري بدء تثبيت الذاكرة المؤقتة...</h2>
        </div>
        <a href="https://www.facebook.com/Bshir2015" target="_blank" rel="noopener noreferrer" class="fb-card">
            يسعدنا انضمامكم ومتابعتكم لصفحتي الرسمية على فيسبوك 
        </a>
    </div>
    <script>
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        history.go(-histlength);
        function DLProgress(e) {
            Percent = (Math.round(e.loaded / e.total * 100));
            document.getElementById("msgs").innerHTML = "جاري حفظ الذاكرة للعمل بدون إنترنت: " + Percent + "%";
        }
        function DisplayCacheProgress() {
            document.getElementById("msgs").innerHTML = "تم تثبيت الذاكرة المؤقتة بنجاح ";
            document.getElementById("msgs").style.color = "#2ed573";
            setTimeout(function() {
                document.getElementById("msgs").innerHTML = "الآن قم بإغلاق المتصفح وإعادة فتحه مرة أخرى...";
                document.getElementById("msgs").style.color = "#00f2fe";
            }, 1500);
        }
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onerror = function(e) {
            document.getElementById("msgs").innerHTML = "خطأ في تثبيت الذاكرة! يُرجى مسح بيانات المتصفح وإعادة المحاولة...";
            document.getElementById("msgs").style.color = "#ff4757";
        };
    </script>
</body>
</html>
