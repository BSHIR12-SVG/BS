<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<title>بشير لصيانة الأجهزة الإلكترونية - تثبيت الذاكرة المؤقتة</title>
<link rel="stylesheet" href="../style.css">
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
  }
  .blue-text {
    color: #007bff;
  }
</style>
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="تم تثبيت ذاكرة التخزين المؤقت بنجاح";setTimeout(function(){window.msgs.innerHTML="أغلق متصفحك ثم أعد فتحه...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="حدث خطأ أثناء تثبيت ذاكرة التخزين المؤقت! - امسح ذاكرة التخزين المؤقت وأعد فتح المتصفح ...";};
</script>

<h1 id="msgs" style="font-size: 30px; margin-bottom: 20px;">بدء تركيب ذاكرة التخزين المؤقت...</h1>
<h1 class="blue-text">مركز بشير لصيانة وتعديل الأجهزة الإلكترونية والرقمية شارع طرابلس اجدابيا</h1>

</body>
</html>
