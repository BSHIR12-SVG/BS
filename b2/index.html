<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بشير لصيانة الأجهزة الإلكترونية - تفعيل التعديل</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        /* خلفية تدرج ناعم مدمجة تعمل أوفلاين بدون أي صور خارجية */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1b2a4a 0%, #0d1117 70%, #05080c 100%);
            background-attachment: fixed;
            background-color: #0d1117;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
        }

        h1.logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            margin-top: 0;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.4), transparent);
            margin: 20px 0 40px 0;
        }

        .loader-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .loader-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00f2fe, transparent);
            animation: loading-bar 2s linear infinite;
        }

        @keyframes loading-bar {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        #msgs {
            font-size: 1.5rem;
            font-weight: 500;
            color: #e6edf3;
            line-height: 1.6;
            margin: 0;
        }

        .fb-card {
            display: block;
            padding: 15px;
            background: rgba(24, 119, 242, 0.1);
            border: 1px solid rgba(24, 119, 242, 0.3);
            border-radius: 12px;
            color: #1877f2;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .fb-card:hover {
            background: rgba(24, 119, 242, 0.2);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="logo-text">Bashir PS4/PS5</h1>
        <hr>
        <div class="loader-card">
            <h2 id="msgs">جاري تثبيت برمجيات الذاكرة...</h2>
        </div>
        <a href="https://www.facebook.com/Bshir2015" target="_blank" rel="noopener noreferrer" class="fb-card">
            مركز بشير لصيانة وتعديل الأجهزة الإلكترونية والرقمية شارع طرابلس اجدابيا 
        </a>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        function updateMsg(text, color) {
            var msgs = document.getElementById("msgs");
            if (msgs) {
                msgs.innerHTML = text;
                if (color) msgs.style.color = color;
            }
        }

        function onScriptError() {
            updateMsg("عذراً، امسح بيانات المتصفح وأعد تثبيت ذاكرة التخزين المؤقت", "#ff4757");
        }

        if (!isPS4) {
            updateMsg("هذا الموقع مخصص لأجهزة بلاي ستيشن 4 فقط", "#ff4757");
            return;
        }

        // التوجيه لصفحات الـ Cache في حال التثبيت الأول
        if (window.applicationCache && window.applicationCache.status === window.applicationCache.UNCACHED) {
            if (fwNum >= 7.00 && fwNum <= 8.52) {
                window.location.href = "cache700.html";
            } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                window.location.href = "cache900.html";
            } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                window.location.href = "cachecss.html";
            } else if (fwNum >= 11.50 && fwNum <= 13.00) {
                window.location.href = "cacheslopkit.html";
            } else {
                updateMsg('نظام غير مدعوم: <span style="color: #ff4757;">' + fwVersion + '</span>');
            }
        } else {
            // تشغيل التعديل عند التوفر داخل الذاكرة
            updateMsg("جاري تحميل GoldHEN... يُرجى الانتظار");
            var script = document.createElement('script');

            if (fwNum >= 7.00 && fwNum <= 8.52) {
                script.type = 'module';
                script.src = "700/alert.js";
            } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                script.type = 'module';
                script.src = "900/alert.js";
            } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                script.src = "css/main.js";
                script.onload = function () {
                    setTimeout(function () {
                        if (typeof doJb === "function") doJb();
                    }, 500);
                };
            } else if (fwNum >= 11.50 && fwNum <= 12.02) {
                script.type = 'module';
                script.src = "slopkit/chain_lapse.js";
            } else if (fwNum >= 12.50 && fwNum <= 13.00) {
                script.type = 'module';
                script.src = "slopkit/chain_poops.js";
            } else {
                updateMsg('نظام غير مدعوم: <span style="color: #ff4757;">' + fwVersion + '</span>');
                return;
            }

            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    });
    </script>
</body>
</html>
