<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="css.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بشير لصيانة الأجهزة الإلكترونية - تثبيت الذاكرة المؤقتة</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        h1.logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00f2fe;
            margin-bottom: 5px;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.4), transparent);
            margin: 20px 0 40px 0;
        }

        .cache-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.25);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            margin-bottom: 40px;
        }

        #msgs {
            font-size: 1.4rem;
            font-weight: 500;
            color: #e6edf3;
            margin: 0 0 15px 0;
        }

        .progress-bar-container {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
            margin-top: 15px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00f2fe;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="logo-text">Bashir PS4/PS5</h1>
        <hr>

        <div class="cache-card">
            <h2 id="msgs">جاري تحضير ذاكرة التخزين المؤقت</h2>
            <div class="progress-bar-container">
                <div class="progress-bar" id="myBar"></div>
            </div>
        </div>
    </div>

    <script>
        function goIndex() {
            document.getElementById("msgs").innerHTML = "...جاري التوجيه لصفحة التفعيل  ";
            document.getElementById("msgs").style.color = "#4cd137";
            setTimeout(function() {
                window.location.href = "index.html";
            }, 1000);
        }

        function DLProgress(e) {
            if (e.lengthComputable && e.total) {
                var Percent = Math.round((e.loaded / e.total) * 100);
                document.getElementById("msgs").innerHTML = "التخزين المؤقت: " + Percent + "%";
                document.getElementById("msgs").style.color = "#00f2fe";
                document.getElementById("myBar").style.width = Percent + "%";
            } else {
                document.getElementById("msgs").innerHTML = " ...جاري التخزين المؤقت";
            }
        }

        function DisplayCacheProgress() {
            document.getElementById("myBar").style.width = "100%";
            document.getElementById("msgs").innerHTML = "تم التثبيت بنجاح!";
            document.getElementById("msgs").style.color = "#4cd137";
            goIndex();
        }

        if (window.applicationCache) {
            var appCache = window.applicationCache;

            appCache.addEventListener("progress", DLProgress, false);
            appCache.addEventListener("cached", DisplayCacheProgress, false);
            appCache.addEventListener("updateready", function(e) {
                try { appCache.swapCache(); } catch(err) {}
                DisplayCacheProgress();
            }, false);

            appCache.addEventListener("noupdate", function(e) {
                goIndex();
            }, false);

            appCache.addEventListener("error", function(e) {

                if (!navigator.onLine) {
                    goIndex();
                } else {
                    document.getElementById("msgs").innerHTML = "حدث خطأ أثناء التثبيت!";
                    document.getElementById("msgs").style.color = "#ff4757";
                    document.getElementById("myBar").style.background = "#ff4757";
                }
            }, false);
        } else {
            goIndex();
        }
    </script>

</body>
</html>
