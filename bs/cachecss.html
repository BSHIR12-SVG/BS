<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="css.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بشير لصيانة الأجهزة الإلكترونية - تثبيت الذاكرة المؤقتة Webkit</title>
    <!-- استدعاء خطوط Google لجعل المظهر احترافي وثابت -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* التنسيق العام المتناسق مع الهوية البصرية الموحدة للموقع */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            /* إضافة صورة الخلفية مع التدرج الداكن للتكامل البصري */
            background: linear-gradient(rgba(13, 17, 23, 0.65), rgba(22, 27, 34, 0.65)), url('../image_9nD6e3.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* حاوية التصميم الرئيسية للشبكة */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* العنوان الرئيسي بنمط خط الألعاب المتوهج نيون */
        h1.logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.4), transparent);
            margin: 20px 0 40px 0;
        }

        /* حاوية شاشة تقدم عملية الـ Cache التفاعلية */
        .cache-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            margin-bottom: 40px;
            position: relative;
        }

        /* نص حالة تركيب الذاكرة */
        #msgs {
            font-size: 1.5rem;
            font-weight: 500;
            color: #e6edf3;
            line-height: 1.6;
            margin: 0;
        }

        /* حاوية زر الفيسبوك الممركز */
        .social-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .fb-card {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            background: rgba(24, 119, 242, 0.1);
            border: 1px solid rgba(24, 119, 242, 0.3);
            border-radius: 12px;
            color: #1877f2;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .fb-card:hover {
            background: rgba(24, 119, 242, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <script>
    // الحفاظ على كود استبدال السجل والتلاعب به لمنع رجوع المستخدم في متصفح الـ PS4
    history.replaceState(null, null, 'index.html');
    var histlength = history.length;
    history.go(-histlength);

    // دالة حساب وعرض نسبة التحميل المؤقت
    function DLProgress(e) {
        var Percent = (Math.round(e.loaded / e.total * 100));
        document.getElementById("msgs").innerHTML = "⚙️ التخزين المؤقت: " + Percent + "%";
        document.getElementById("msgs").style.color = "#00f2fe";
    }

    // دالة انتهاء التثبيت ونجاح العمل أوفلاين
    function DisplayCacheProgress() {
        document.getElementById("msgs").innerHTML = "✔ تم تثبيت ذاكرة التخزين المؤقت بنجاح";
        document.getElementById("msgs").style.color = "#4cd137";
        setTimeout(function() {
            document.getElementById("msgs").innerHTML = "🔄 أغلق متصفحك ثم أعد فتحه الآن";
            document.getElementById("msgs").style.color = "#e6edf3";
        }, 2000);
    }

    // ربط مستمعي الأحداث بالواجهة المطورة
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onerror = function(e) {
        document.getElementById("msgs").innerHTML = "❌ حدث خطأ أثناء التثبيت! امسح الكاش وأعد فتح المتصفح";
        document.getElementById("msgs").style.color = "#ff4757";
    };
    </script>

    <div class="container">
        <!-- العنوان الرئيسي الموحد للهوية البصرية -->
        <h1 class="logo-text">PS4 9.00 - 13.00</h1>
        <hr>

        <!-- بطاقة حالة التخزين المؤقت النيون الاحترافية -->
        <div class="cache-card">
            <h2 id="msgs">⏳ بدء تركيب ذاكرة التخزين المؤقت...</h2>
        </div>

        <!-- زر الفيسبوك الموحد والأنيق بالمنتصف -->
        <div class="social-container">
            <a href="https://www.facebook.com/Bshir2015" class="fb-card">
                🔵 يسعدنا انضمامكم ومتابعتكم لصفحتنا الرسمية على فيسبوك
            </a>
        </div>
    </div>

</body>
</html>
