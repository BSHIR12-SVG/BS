<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بشير لصيانة الأجهزة الإلكترونية - تفعيل التعديل</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            /* إضافة ../ لإظهار الخلفية الموجودة بالمجلد الرئيسي */
            background: linear-gradient(rgba(13, 17, 23, 0.65), rgba(22, 27, 34, 0.65)), url('../image_9nD6e3.png') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
        }

        h1.logo-text {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            margin-top: 0;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.4), transparent);
            margin: 20px 0 40px 0;
        }

        .loader-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .loader-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00f2fe, transparent);
            animation: loading-bar 2s linear infinite;
        }

        @keyframes loading-bar {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        #msgs {
            font-size: 1.5rem;
            font-weight: 500;
            color: #e6edf3;
            line-height: 1.6;
            margin: 0;
        }

        .fb-card {
            display: block;
            padding: 15px;
            background: rgba(24, 119, 242, 0.1);
            border: 1px solid rgba(24, 119, 242, 0.3);
            border-radius: 12px;
            color: #1877f2;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .fb-card:hover {
            background: rgba(24, 119, 242, 0.2);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <script>
    var uaFull = navigator.userAgent;
    var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
    var isPS4 = match !== null;
    var fwVersion = isPS4 ? match[1] : "Unknown";
    var fwNum = parseFloat(fwVersion);

    function onScriptError() {
        var msgs = document.getElementById("msgs");
        if (msgs) {
            msgs.innerHTML = "❌ امسح بيانات المتصفح وأعد تثبيت ذاكرة التخزين المؤقت";
            msgs.style.color = "#ff4757";
        }
    }

    if (!isPS4) {
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("msgs").innerHTML = "🎮 مخصّص لأجهزة بلاي ستيشن 4 ذات برمجيات النظام من 7.00 إلى 13.00";
        });
    } else {
        if (window.applicationCache && window.applicationCache.status === 0) {
            if (fwNum >= 7.00 && fwNum <= 8.52) {
                window.location.replace("cache700.html");
            } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                window.location.replace("cache900.html");
            } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                window.location.replace("cachecss.html");
            } else if (fwNum >= 11.50 && fwNum <= 13.00) {
                window.location.replace("cacheslopkit.html");
            } else {
                document.addEventListener("DOMContentLoaded", function() {
                    document.getElementById("msgs").innerHTML = 'Unsupported Firmware: <span style="color: #ff4757;">' + fwVersion + '</span>';
                });
            }
        } else {
            var script = document.createElement('script');
            if (fwNum >= 7.00 && fwNum <= 8.52) {
                script.type = 'module';
                script.src = "700/alert.js";
            } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                script.type = 'module';
                script.src = "900/alert.js";
            } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                script.src = "css/main.js";
                script.onload = function () {
                    setTimeout(function () {
                        if (typeof doJb === "function") doJb();
                    }, 500);
                };
            } else if (fwNum >= 11.50 && fwNum <= 12.02) {
                script.type = 'module';
                script.src = "slopkit/chain_lapse.js";
            } else if (fwNum >= 12.50 && fwNum <= 13.00) {
                script.type = 'module';
                script.src = "slopkit/chain_poops.js";
            }

            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
    </script>

    <div class="container">
        <h1 class="logo-text">Bashir PS4/PS5</h1>
        <hr>

        <div class="loader-card">
            <h2 id="msgs">⏳ جارٍ تحميل GoldHEN... يُرجى الانتظار</h2>
        </div>

        <a href="https://www.facebook.com/Bshir2015" target="_blank" rel="noopener noreferrer" class="fb-card">
            ✨ يسعدنا انضمامكم ومتابعتكم لصفحتنا الرسمية على فيسبوك ✨
        </a>
    </div>

</body>
</html>
